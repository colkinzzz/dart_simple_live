name: Build Android arm64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/car-window-adaptation
    paths:
      - "simple_live_app/**"
      - "simple_live_core/**"
      - ".github/workflows/build-android-arm64.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore simple_live_app/android/app/upload-keystore.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Simple Live,O=Local,C=CN"

          cat > simple_live_app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=android
          keyPassword=android
          keyAlias=upload
          EOF

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Create checksum
        run: |
          cd simple_live_app/build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk > app-arm64-v8a-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-car-arm64-v8a-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
